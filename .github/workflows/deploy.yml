name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is REQUIRED for OIDC. Without it the role assumption fails
# with a confusing credentials error rather than a permissions one.
permissions:
  id-token: write
  contents: read
  pull-requests: read

# Terraform state allows one writer. Serialise deploys rather than letting two
# pushes race for the S3 lock. Never cancel in progress - a half-applied stack
# is worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.2
  DOTNET_VERSION: "10.0.x"

jobs:
  # Path filtering so each service deploys independently, per the design.
  # workflow_dispatch forces everything to deploy.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      # NOTE the explicit `== 'true'`. dorny/paths-filter emits the STRING
      # 'false', and a non-empty string is truthy in a GitHub expression - so
      # `steps.filter.outputs.ingest || ...` short-circuits to 'false' and the
      # workflow_dispatch fallback never fires. Compare, do not coerce.
      ingest: ${{ steps.filter.outputs.ingest == 'true' || github.event_name == 'workflow_dispatch' }}
      notifier: ${{ steps.filter.outputs.notifier == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingest:
              - 'src/Ingest/**'
              - 'src/Contracts/**'
              - 'src/Directory.*.props'
              - 'src/Directory.Build.targets'
            notifier:
              - 'src/Notifier/**'
              - 'src/Contracts/**'
              - 'src/Directory.*.props'
              - 'src/Directory.Build.targets'

  terraform:
    name: terraform apply
    runs-on: ubuntu-latest
    outputs:
      ingest_function_name: ${{ steps.outputs.outputs.ingest_function_name }}
      relay_function_name: ${{ steps.outputs.outputs.relay_function_name }}
      connections_function_name: ${{ steps.outputs.outputs.connections_function_name }}
      consumer_function_name: ${{ steps.outputs.outputs.consumer_function_name }}
      http_api_url: ${{ steps.outputs.outputs.http_api_url }}
      websocket_url: ${{ steps.outputs.outputs.websocket_url }}
      amplify_url: ${{ steps.outputs.outputs.amplify_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm assumed identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/main
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform format check
        working-directory: infra/main
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/main
        run: terraform validate

      - name: Terraform apply
        working-directory: infra/main
        run: terraform apply -auto-approve

      # Read names back from state rather than hardcoding them in this file -
      # a rename in Terraform would otherwise silently deploy to nothing.
      - name: Capture outputs
        id: outputs
        working-directory: infra/main
        run: |
          echo "ingest_function_name=$(terraform output -raw ingest_submit_function_name)" >> "$GITHUB_OUTPUT"
          echo "relay_function_name=$(terraform output -raw ingest_outbox_relay_function_name)" >> "$GITHUB_OUTPUT"
          echo "connections_function_name=$(terraform output -raw notifier_connections_function_name)" >> "$GITHUB_OUTPUT"
          echo "consumer_function_name=$(terraform output -raw notifier_consumer_function_name)" >> "$GITHUB_OUTPUT"
          echo "http_api_url=$(terraform output -raw http_api_url)" >> "$GITHUB_OUTPUT"
          echo "websocket_url=$(terraform output -raw websocket_url)" >> "$GITHUB_OUTPUT"
          echo "amplify_url=$(terraform output -raw amplify_default_domain)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "HTTP API: ${{ steps.outputs.outputs.http_api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "WebSocket: ${{ steps.outputs.outputs.websocket_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SPA: ${{ steps.outputs.outputs.amplify_url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-ingest:
    name: deploy ingest
    # needs: terraform is what guarantees infrastructure exists before code is
    # pushed to it. EVERY future deploy job must declare it.
    needs: [terraform, changes]
    if: needs.changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Tests run before deploy, not after. The DynamoDB Local container the
      # handler contract tests need is available on ubuntu-latest runners.
      - name: Test
        run: dotnet test src/AwsSampleApp.slnx -c Release

      - name: Publish the submit function
        run: >
          dotnet publish src/Ingest/Ingest.Api/Ingest.Api.csproj
          -c Release -r linux-arm64 --self-contained false
          -o publish/ingest-api

      - name: Zip the submit function
        working-directory: publish/ingest-api
        run: zip -r ../ingest-api.zip .

      - name: Deploy the submit function
        run: >
          aws lambda update-function-code
          --function-name ${{ needs.terraform.outputs.ingest_function_name }}
          --zip-file fileb://publish/ingest-api.zip
          --publish

      - name: Publish the outbox relay
        run: >
          dotnet publish src/Ingest/Ingest.OutboxRelay/Ingest.OutboxRelay.csproj
          -c Release -r linux-arm64 --self-contained false
          -o publish/ingest-outbox-relay

      - name: Zip the outbox relay
        working-directory: publish/ingest-outbox-relay
        run: zip -r ../ingest-outbox-relay.zip .

      - name: Deploy the outbox relay
        run: >
          aws lambda update-function-code
          --function-name ${{ needs.terraform.outputs.relay_function_name }}
          --zip-file fileb://publish/ingest-outbox-relay.zip
          --publish

  deploy-notifier:
    name: deploy notifier
    needs: [terraform, changes]
    if: needs.changes.outputs.notifier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Test
        run: dotnet test src/AwsSampleApp.slnx -c Release

      - name: Publish the connections function
        run: >
          dotnet publish src/Notifier/Notifier.Connections/Notifier.Connections.csproj
          -c Release -r linux-arm64 --self-contained false
          -o publish/notifier-connections

      - name: Zip the connections function
        working-directory: publish/notifier-connections
        run: zip -r ../notifier-connections.zip .

      - name: Deploy the connections function
        run: >
          aws lambda update-function-code
          --function-name ${{ needs.terraform.outputs.connections_function_name }}
          --zip-file fileb://publish/notifier-connections.zip
          --publish

      - name: Publish the consumer function
        run: >
          dotnet publish src/Notifier/Notifier.Consumer/Notifier.Consumer.csproj
          -c Release -r linux-arm64 --self-contained false
          -o publish/notifier-consumer

      - name: Zip the consumer function
        working-directory: publish/notifier-consumer
        run: zip -r ../notifier-consumer.zip .

      - name: Deploy the consumer function
        run: >
          aws lambda update-function-code
          --function-name ${{ needs.terraform.outputs.consumer_function_name }}
          --zip-file fileb://publish/notifier-consumer.zip
          --publish

# ---------------------------------------------------------------------------
# Further deploy jobs are added by the phase that introduces them:
#
#   The Phase 5 consumer joins deploy-notifier - it is the same service.
#
# EVERY one of them MUST declare `needs: terraform`.
# ---------------------------------------------------------------------------
